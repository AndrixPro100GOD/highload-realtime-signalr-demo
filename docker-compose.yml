# Полный локальный high-load стек: HAProxy(L4), Nginx(L7), SignalR, REST API, video, Redis, PostgreSQL, Prometheus и Grafana.
# Запуск из корня репозитория. Конфиги прокси/Prometheus/Grafana и video кладём в образы (docker/*/Dockerfile):
# bind-mount с Windows (F:\...) в Docker Desktop часто даёт invalid volume specification.

services:
  haproxy:
    build:
      context: ./docker/haproxy
    image: highload-realtime-signalr-demo/haproxy:local
    cpus: 2.0
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 250000
        hard: 250000
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8404:8404"
    depends_on:
      nginx-l7:
        condition: service_started
      video-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - obs

  nginx-l7:
    build:
      context: ./docker/nginx
    image: highload-realtime-signalr-demo/nginx-l7:local
    cpus: 2.0
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    depends_on:
      realtime-svc:
        condition: service_healthy
      api-svc:
        condition: service_healthy
      video-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/l7 | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - app
      - obs

  realtime-svc:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=highload_realtime;Username=postgres;Password=postgres
      DOTNET_GCServer: "1"
      DOTNET_GCRetainVM: "1"
      DOTNET_TieredPGO: "1"
      DOTNET_TC_QuickJitForLoops: "1"
      COMPlus_ThreadPool_ForceMinWorkerThreads: "512"
      Performance__Redis__Configuration: redis:6379,abortConnect=false,connectRetry=10,connectTimeout=2000,syncTimeout=2000,asyncTimeout=2000,keepAlive=30
      Performance__Kestrel__HttpPort: 8080
      Performance__Batching__QueueCapacity: 20000
      Performance__Batching__DropThresholdRatio: 0.70
      Performance__HubGuard__TokenLimit: 120
      Performance__HubGuard__TokensPerPeriod: 60
    cpus: 4.0
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app
      - data
      - obs

  api-svc:
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    cpus: 1.0
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app
      - obs

  video-svc:
    build:
      context: ./docker/video
    image: highload-realtime-signalr-demo/video-svc:local
    cpus: 1.0
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Временное решение — отключаем bind-mount, чтобы запустилось
    # Конфиг nginx.conf уже лежит внутри образа (через Dockerfile)
    # volumes:
    #   - ./docker/video/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - app
      - obs

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 1024mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
      - --hz
      - "50"
      - --tcp-backlog
      - "32768"
      - --client-output-buffer-limit
      - pubsub 256mb 64mb 60
    cpus: 2.0
    mem_limit: 1536m
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data
      - obs

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9121:9121"
    networks:
      - data
      - obs

  haproxy-exporter:
    image: prom/haproxy-exporter:v0.15.0
    command:
      - --haproxy.scrape-uri=http://haproxy:8404/stats;csv
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - edge
      - obs

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://nginx-l7:8081/nginx_status
    depends_on:
      nginx-l7:
        condition: service_healthy
    networks:
      - app
      - obs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: highload_realtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d highload_realtime"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  prometheus:
    build:
      context: ./docker/prometheus
    image: highload-realtime-signalr-demo/prometheus:local
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - realtime-svc
      - api-svc
      - haproxy-exporter
      - nginx-exporter
      - redis-exporter
    networks:
      - obs

  grafana:
    build:
      context: ./docker/grafana
    image: highload-realtime-signalr-demo/grafana:local
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - obs

networks:
  edge:
  app:
  data:
  obs:

volumes:
  grafana-data:
  postgres-data:
  prometheus-data:
  redis-data:
