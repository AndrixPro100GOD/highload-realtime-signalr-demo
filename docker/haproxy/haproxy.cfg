# HAProxy остаётся на L4: быстро принимает TCP-сессии и не пытается читать HTTP path.
# Path-based routing выполняет Nginx на следующем уровне.

global
    log stdout format raw local0
    # Performance tuning: maxconn должен быть выше целевых WebSocket, но ниже лимитов ОС/ulimit контейнера.
    maxconn 100000
    tune.bufsize 32768
    tune.maxrewrite 8192

defaults
    log global
    mode tcp
    option tcplog
    option tcpka
    timeout connect 3s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend main_tcp
    # Performance tuning: backlog помогает пережить burst WebSocket handshakes без потерь на accept queue.
    bind *:8080 backlog 32768
    maxconn 80000
    default_backend nginx_l7

backend nginx_l7
    balance roundrobin
    option tcp-check
    # server-template позволяет увидеть несколько реплик nginx-l7 при docker compose --scale.
    server-template nginx-l7- 4 nginx-l7:8080 check resolvers docker init-addr none send-proxy-v2

frontend video_tcp
    bind *:8081 backlog 16384
    maxconn 20000
    default_backend video_direct

backend video_direct
    balance roundrobin
    option tcp-check
    # Media bypass: видео не проходит через L7, если клиент идёт на порт 8081.
    server-template video-svc- 4 video-svc:8080 check resolvers docker init-addr none

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
