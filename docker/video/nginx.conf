# Лёгкий video-svc: VOD HLS с одним MP4 и byte-range (без .ts сегментов).

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        return 302 /video/index.m3u8;
    }

    # root + префикс /video/ дают файлы из /usr/share/nginx/html/video/ (плейлист и sample.mp4 рядом).
    # Accept-Ranges явно подсказывает клиенту, что сегменты можно тянуть частями — типичный паттерн для VOD по одному MP4.
    location /video/ {
        root /usr/share/nginx/html;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=60";
        add_header X-Content-Type-Options "nosniff";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4;
        }
    }
}
