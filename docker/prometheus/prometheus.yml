global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: realtime-svc
    metrics_path: /metrics
    static_configs:
      - targets:
          - realtime-svc:8080

  - job_name: api-svc
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-svc:8080

  - job_name: haproxy
    static_configs:
      - targets:
          - haproxy-exporter:9101

  - job_name: nginx-l7
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
