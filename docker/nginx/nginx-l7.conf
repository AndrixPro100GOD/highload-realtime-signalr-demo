# Nginx — L7-уровень: маршрутизация по path, sticky для SignalR, WebSocket upgrade и rate limiting.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_limit:32m rate=200r/s;
limit_req_zone $binary_remote_addr zone=signalr_negotiate_limit:32m rate=100r/s;

upstream realtime_backend {
    zone realtime_backend 64k;
    hash $binary_remote_addr consistent;
    server realtime-svc:8080 resolve;
    keepalive 512;
}

upstream api_backend {
    zone api_backend 64k;
    least_conn;
    server api-svc:8080 resolve;
    keepalive 256;
}

upstream video_backend {
    zone video_backend 64k;
    least_conn;
    server video-svc:8080 resolve;
    keepalive 128;
}

server {
    listen 8080 proxy_protocol;
    server_name _;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header proxy_protocol;

    proxy_http_version 1.1;
    # Performance tuning: long read/send timeout нужен WebSocket, connect timeout должен быстро убирать битые upstream.
    proxy_connect_timeout 3s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /health/l7 {
        access_log off;
        return 200 "ok\n";
    }

    location = /hubs/realtime/negotiate {
        # Performance tuning: negotiate bursts ограничиваются на L7 до попадания в Kestrel/ThreadPool.
        limit_req zone=signalr_negotiate_limit burst=200 nodelay;
        proxy_pass http://realtime_backend;
    }

    location /hubs/realtime {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://realtime_backend;
    }

    location /realtime/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://realtime_backend;
    }

    location /hub/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://realtime_backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=400 nodelay;
        proxy_pass http://api_backend;
    }

    # L7 fallback для видео оставлен для сравнения с прямым L4-путём на :8081.
    location /video/ {
        proxy_pass http://video_backend;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://realtime_backend;
    }
}

server {
    listen 8081;
    server_name _;

    location = /health/l7 {
        access_log off;
        return 200 "ok\n";
    }

    location = /nginx_status {
        access_log off;
        stub_status;
    }
}
